<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Portal - Voterwa</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7fa; padding-bottom: 50px; }
    header { background: #003366; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .candidate-row { display: flex; align-items: center; gap: 15px; padding: 15px; border: 2px solid #eee; border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
    .candidate-row.selected { background: #e7f3ff; border-color: #007bff; }
    .candidate-row img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
    .submit-btn { background: #28a745; color: white; padding: 15px 40px; border: none; border-radius: 50px; font-size: 1.2rem; cursor: pointer; width: 100%; font-weight: bold; }
  </style>
</head>
<body>
<header>
  <div id="stdName">Voter: Loading...</div>
  <button onclick="localStorage.removeItem('activeSession'); window.location.href='login.html'">Logout</button>
</header>

<div class="container">
  <div id="adminMsg" class="card">Syncing with server...</div>
  <div id="votingArea"></div>
  <button id="submitBtn" class="submit-btn" onclick="submitVotes()">Submit My Votes</button>
</div>

<script>
  let session = JSON.parse(localStorage.getItem('activeSession'));
  if(!session) window.location.href = 'login.html';
  document.getElementById('stdName').innerText = "Hi, " + session.userName;

  async function loadBallot() {
    const res = await fetch('/api/get_db');
    const db = await res.json();
    const school = db.schools.find(s => s.schoolCode === session.schoolCode);
    const settings = school.settings;

    if(settings.votedStudents && settings.votedStudents[session.userCode]) {
      document.getElementById('adminMsg').innerHTML = "✅ <strong>You have already voted!</strong> Check results in the 'Elected' tab.";
      document.getElementById('submitBtn').style.display = 'none';
      return;
    }

    if(settings.electionStatus !== 'started') {
      document.getElementById('adminMsg').innerText = "The election is currently closed.";
      document.getElementById('submitBtn').style.display = 'none';
      return;
    }

    document.getElementById('adminMsg').innerText = settings.adminMessage || "Cast your vote.";
    const area = document.getElementById('votingArea');
    area.innerHTML = "";
    
    Object.keys(settings.candidates || {}).forEach(cat => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<h2>${cat}</h2>`;
      settings.candidates[cat].forEach(c => {
        const row = document.createElement('div');
        row.className = 'candidate-row';
        row.innerHTML = `<img src="${c.img}"> <strong>${c.first}</strong> <input type="radio" name="${cat}" value="${c.id}" style="margin-left:auto;">`;
        row.onclick = () => {
          row.parentElement.querySelectorAll('.candidate-row').forEach(r => r.classList.remove('selected'));
          row.classList.add('selected');
          row.querySelector('input').checked = true;
        };
        card.appendChild(row);
      });
      area.appendChild(card);
    });
  }

  async function submitVotes() {
    const radios = document.querySelectorAll('input[type="radio"]:checked');
    const res = await fetch('/api/get_db');
    const db = await res.json();
    const school = db.schools.find(s => s.schoolCode === session.schoolCode);

    if(radios.length < Object.keys(school.settings.candidates).length) return alert("Vote in all categories!");
    
    radios.forEach(r => school.settings.votes[r.value] = (school.settings.votes[r.value] || 0) + 1);
    school.settings.votedStudents[session.userCode] = true;

    await fetch('/api/save_db', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(db)
    });

    alert("Votes Synced to Server!");
    location.reload();
  }
  loadBallot();
</script>
</body>
</html>
