<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal - Voterwa</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f7fa; padding-bottom: 50px; }
    header { background: #003366; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #003366; margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 1.2rem; }
    
    .candidate-row { display: flex; align-items: center; gap: 15px; padding: 15px; border: 2px solid #eee; border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
    .candidate-row:hover { border-color: #007bff; background: #fcfdfe; }
    .candidate-row.selected { background: #e7f3ff; border-color: #007bff; }
    .candidate-row img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #ddd; }
    .candidate-row strong { font-size: 1.1rem; flex-grow: 1; }
    
    .submit-btn { background: #28a745; color: white; padding: 18px 40px; border: none; border-radius: 50px; font-size: 1.2rem; cursor: pointer; width: 100%; font-weight: bold; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3); transition: transform 0.2s; }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }
    
    .logout-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <div id="stdName">Voter: Loading...</div>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="container">
  <div id="adminMsg" class="card">Syncing with server...</div>
  
  <div id="votingArea">
    <!-- Categories and Candidates will appear here -->
  </div>
  
  <button id="submitBtn" class="submit-btn" onclick="submitVotes()">Submit My Votes</button>
</div>

<script>
  // 1. Session Security
  let session = JSON.parse(localStorage.getItem('activeSession'));
  if(!session || session.role !== 'student') {
    window.location.href = 'login.html';
  }
  document.getElementById('stdName').innerText = "Hi, " + session.userName;

  let requiredCategories = 0;

  // 2. Load Ballot from Server
  async function loadBallot() {
    try {
      const res = await fetch('/api/get_db');
      const db = await res.json();
      
      // Find this student's specific school
      const school = db.schools.find(s => s.schoolCode === session.schoolCode);
      if (!school) {
        document.getElementById('adminMsg').innerText = "School record not found.";
        return;
      }

      const settings = school.settings;

      // Check if already voted
      if(settings.votedStudents && settings.votedStudents[session.userCode]) {
        document.getElementById('adminMsg').innerHTML = "✅ <strong>You have already voted!</strong> Your voice has been heard.";
        document.getElementById('votingArea').innerHTML = "<div class='card' style='text-align:center;'>Thank you for participating in the election.</div>";
        document.getElementById('submitBtn').style.display = 'none';
        return;
      }

      // Check if election is open
      if(settings.electionStatus !== 'started') {
        document.getElementById('adminMsg').innerText = "The election is currently closed or has not started yet.";
        document.getElementById('submitBtn').style.display = 'none';
        return;
      }

      // Set Admin message and count categories
      document.getElementById('adminMsg').innerText = settings.adminMessage || "Please select one candidate for each category below.";
      const area = document.getElementById('votingArea');
      area.innerHTML = "";
      
      const candidatesByCat = settings.candidates || {};
      requiredCategories = Object.keys(candidatesByCat).length;

      // Build HTML for each category
      Object.keys(candidatesByCat).forEach(catName => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h2>${catName}</h2>`;
        
        candidatesByCat[catName].forEach(cand => {
          const row = document.createElement('div');
          row.className = 'candidate-row';
          row.innerHTML = `
            <img src="${cand.img || 'https://placeholder.com'}" alt="${cand.first}">
            <strong>${cand.first}</strong>
            <input type="radio" name="${catName}" value="${cand.id}" style="width:20px; height:20px;">
          `;
          
          row.onclick = (e) => {
            // Highlight selection
            row.parentElement.querySelectorAll('.candidate-row').forEach(r => r.classList.remove('selected'));
            row.classList.add('selected');
            row.querySelector('input').checked = true;
          };
          
          card.appendChild(row);
        });
        area.appendChild(card);
      });

    } catch (err) {
      console.error(err);
      document.getElementById('adminMsg').innerText = "Connection error. Please refresh the page.";
    }
  }

  // 3. Submit Selections to Server
  async function submitVotes() {
    const selectedOptions = document.querySelectorAll('input[type="radio"]:checked');

    // Validation
    if(selectedOptions.length < requiredCategories) {
      return alert("Please select a candidate in every category before submitting!");
    }

    if(!confirm("Are you sure you want to submit your votes? This cannot be undone.")) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "Recording your vote...";

    // Prepare data for the secure server route
    const payload = {
      student_code: session.userCode,
      school_code: session.schoolCode,
      selections: Array.from(selectedOptions).map(input => input.value)
    };

    try {
      const response = await fetch('/api/cast_vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === "success") {
        alert("Success! Your votes have been securely recorded.");
        location.reload(); // Refresh to show the "Already Voted" state
      } else {
        alert("Error: " + result.message);
        btn.disabled = false;
        btn.innerText = "Submit My Votes";
      }
    } catch (err) {
      alert("Network error. Check your internet and try again.");
      btn.disabled = false;
      btn.innerText = "Submit My Votes";
    }
  }

  function logout() {
    localStorage.removeItem('activeSession');
    window.location.href = 'index.html';
  }

  // Initialize
  loadBallot();
</script>

</body>
</html>
