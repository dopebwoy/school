<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Voterwa</title>
  <style>
    body {
      margin: 0; font-family: 'Segoe UI', Arial, sans-serif; color: white; min-height: 100vh;
      background: linear-gradient(rgba(0, 0, 50, 0.75), rgba(0, 0, 50, 0.75));
      background-size: cover; background-position: center; background-attachment: fixed;
      display: flex; flex-direction: column;
    }
    .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .glass-form {
      background: rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 40px;
      backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2);
      width: 100%; max-width: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    h2 { color: #ffd700; margin-top: 0; text-align: center; font-size: 2rem; }
    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #00bfff; font-weight: bold; }
    input, textarea {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.3); color: white; font-size: 1rem; box-sizing: border-box;
    }
    input:focus, textarea:focus { outline: none; border-color: #ffd700; background: rgba(0,0,0,0.5); }
    button {
      width: 100%; padding: 15px; background: #007bff; color: white; border: none;
      border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1.1rem;
    }
    button:hover { background: #0056b3; transform: scale(1.02); }
    .contact-info { margin-top: 25px; text-align: center; font-size: 0.9rem; color: #bbb; }
  </style>
</head>
<body>
  <div id="navbar-container"></div>

  <div class="container">
    <div class="glass-form">
      <h2>Get In Touch</h2>
      <p style="text-align: center; color: #ddd; margin-bottom: 30px;">Register your school or ask for a demo.</p>
      
      <form id="contactForm">
        <div class="input-group">
          <label>School Name</label>
          <input type="text" placeholder="e.g. ES Rugabano" required>
        </div>
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" placeholder="school@email.rw" required>
        </div>
        <div class="input-group">
          <label>Message</label>
          <textarea rows="4" placeholder="How can we help your school?" required></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>
      
      <div class="contact-info">
        📍 Kigali, Rwanda | 📧 info@voterwa.rw <br>
        🇷🇼 Supporting Digital Literacy in Schools
      </div>
    </div>
  </div>

  <script>
    fetch('navbar.html').then(res => res.text()).then(data => {
      document.getElementById('navbar-container').innerHTML = data;
    });

    document.getElementById('contactForm').onsubmit = (e) => {
      e.preventDefault();
      alert("✅ Message Sent! Our team will contact your school shortly.");
      window.location.href = 'index.html';
    };
  </script>
</body>
</html>
